# Security headers for every response from app.remembra.dev (included by nginx.conf).
#
# nginx drops a server's add_header lines in any location that sets its own,
# so nginx.conf includes this file again in each such location.
#
# The CSP is written for this dashboard as built by dashboard/Dockerfile:
#   script-src   the theme bootstrap in index.html (by hash), Paddle.js, Cloudflare Turnstile
#   connect-src  the API (VITE_API_URL, https://api.remembra.dev) and its WebSocket, Paddle, Turnstile
#   frame-src    the Paddle checkout overlay (live and sandbox) and the Turnstile widget
# Building with a different VITE_API_URL means changing connect-src to match.
# After editing the inline script in index.html, update its hash here
# (tests/test_dashboard_nginx.py prints the one it expects).
#
# Paddle hosts. Paddle's docs say to load Paddle.js only from https://cdn.paddle.com/
# (https://developer.paddle.com/paddlejs/include-paddlejs); script-src allows exactly that.
# developer.paddle.com publishes no CSP allowlist (checked 2026-09-26: the Paddle.js
# include page, "Build an overlay checkout" and the go-live checklist), so the checkout
# frame hosts (buy / sandbox-buy.paddle.com) and connect-src https://*.paddle.com are our
# best reading, not Paddle's list. They could not be verified against a live checkout.
#
# So for launch the CSP is sent as Content-Security-Policy-Report-Only: a wrong host
# cannot break checkout; the browser loads it and reports the violation to
# api.remembra.dev/api/v1/csp-report, which logs it (csp_violation). Every other
# header here is enforced; X-Frame-Options: DENY stands in for frame-ancestors, which
# report-only mode ignores. docs/DEPLOYING.md ("Content-Security-Policy: report-only at
# launch") says how to switch to enforcing after a clean week of reports.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=(), payment=(self \"https://buy.paddle.com\" \"https://sandbox-buy.paddle.com\")" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-kBtD7MRRC5pNCs8UHfmM4+yaMqhRzKUgFXZW90pGafk=' https://cdn.paddle.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.paddle.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.remembra.dev wss://api.remembra.dev https://*.paddle.com https://challenges.cloudflare.com; frame-src https://buy.paddle.com https://sandbox-buy.paddle.com https://challenges.cloudflare.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri https://api.remembra.dev/api/v1/csp-report" always;
