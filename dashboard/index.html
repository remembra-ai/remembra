  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121615" />
    <title>Remembra</title>
    <meta name="description" content="Mission control for your AI agents: the handoff trail, agent activity, inbox and shared memory." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Dark by default for every visitor; an explicit choice (the theme toggle,
         saved as darkMode) wins. Applied before first paint. Storage may be unavailable. */
      (function () {
        var dark = true;
        try {
          var saved = localStorage.getItem('darkMode');
          if (saved === 'false') dark = false;
        } catch (e) {}
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Paddle.js for checkout (Billing and /pay). No inline handler: the CSP in nginx.conf allows none. -->
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
