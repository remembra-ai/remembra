# app.remembra.dev: the whole nginx configuration for the dashboard (a SPA).
#
# Built into the image by dashboard/Dockerfile (Coolify app "remembra-dashboard":
# exposed port 8080). tests/test_dashboard_nginx.py reads it.
#
# CTR-1: the process runs as the unprivileged "nginx" user (as landing/ does),
# so it listens on 8080 and keeps its pid and temp files in /tmp. It used to be
# a server block in conf.d/default.conf under the image's root-run nginx.conf.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        # Behind Cloudflare and the Coolify proxy: redirects nginx makes itself
        # stay relative, so they never point at http:// or port 8080.
        absolute_redirect off;
        port_in_redirect off;

        include /etc/nginx/remembra-headers.conf;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

        # Cache static assets (file names carry a content hash)
        location /assets/ {
            include /etc/nginx/remembra-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # No cache for index.html (always fetch fresh to get new asset hashes)
        location = /index.html {
            include /etc/nginx/remembra-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # SPA routing - fallback to index.html (/pay, /verify-email, /oauth/callback, /signup, ...)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            include /etc/nginx/remembra-headers.conf;
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "healthy\n";
        }
    }
}
