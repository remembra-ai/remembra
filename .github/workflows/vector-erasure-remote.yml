name: Remote vector erasure
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  killed-worker:
    name: Killed pending worker with late server-Qdrant completion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -e ".[server,cloud,dev,mcp,encryption]"
      - name: Kill writer, delete, commit remote request, recover after restart
        env:
          REMEMBRA_TYPESAFE_MODE: "off"
          REMEMBRA_TEST_QDRANT_URL: http://127.0.0.1:6333
        run: >
          pytest tests/test_vector_erasure_remote.py -q --no-cov -p no:cacheprovider
          --basetemp="${{ runner.temp }}/remote-vector-erasure"
          --junitxml=remote-vector-erasure.xml
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-vector-erasure
          path: remote-vector-erasure.xml
