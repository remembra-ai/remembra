name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint & type-check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        # Include mcp + encryption: the test suite imports remembra.mcp.server
        # (needs the `mcp` package) and the encryption paths, so [server,cloud,dev]
        # alone fails test collection.
        run: pip install -e ".[server,cloud,dev,mcp,encryption]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      # Mypy is advisory: the codebase carries ~206 pre-existing type errors
      # (spread across ~48 files: no-any-return, union-attr, arg-type, …). It
      # runs and reports on every build, but does not block merges while that
      # debt is being burned down incrementally. Remove continue-on-error once
      # `mypy src/remembra` is clean.
      - name: Mypy (advisory)
        run: mypy src/remembra
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # mcp + encryption are needed at test-collection time (tests import
        # remembra.mcp.server and the encryption paths).
        run: pip install -e ".[server,cloud,dev,mcp,encryption]"

      - name: Run tests
        run: pytest --tb=short --ignore=tests/test_billing_paddle.py

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Docker build smoke-test
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: remembra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
