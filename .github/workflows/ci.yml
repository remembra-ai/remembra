name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint & type-check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        # mcp + encryption for test collection; langchain/langgraph/openai-agents
        # so mypy can type-check the integration adapters against real framework
        # types (they import those libs at module top).
        run: pip install -e ".[server,cloud,dev,mcp,encryption,langchain,langgraph,openai-agents]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy
        run: mypy src/remembra

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # mcp + encryption are needed at test-collection time (tests import
        # remembra.mcp.server and the encryption paths).
        run: pip install -e ".[server,cloud,dev,mcp,encryption]"

      - name: Run tests
        run: pytest --tb=short --ignore=tests/test_billing_paddle.py

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # The install the site advertises, from the built wheel
  # ---------------------------------------------------------------------------
  # Every other job installs the server extras, so a server-only import in a
  # client command would pass them. This one installs exactly what
  # `pipx install remembra` and `pipx install 'remembra[mcp]'` get.
  wheel-install:
    name: Wheel install (no extras, then [mcp], then the dashboard's command)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist

      - name: Base install runs the relay and the installers
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/pip install dist/*.whl
          /tmp/base/bin/remembra-relay --help
          /tmp/base/bin/remembra-install --help
          /tmp/base/bin/remembra-install-codex --help
          /tmp/base/bin/remembra-doctor --help

      - name: "[mcp] install starts the MCP server"
        run: |
          python -m venv /tmp/mcp
          /tmp/mcp/bin/pip install "$(ls dist/*.whl)[mcp]"
          /tmp/mcp/bin/python -c 'import remembra.mcp.server'
          /tmp/mcp/bin/remembra-relay --help
          # main() gets past every import and stops at config validation.
          out=$(REMEMBRA_URL= /tmp/mcp/bin/remembra-mcp </dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "REMEMBRA_URL environment variable is required"
          # The server command on an [mcp]-only install names the missing extra instead of a traceback.
          out=$(/tmp/mcp/bin/remembra 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "needs the 'server' extra"

      - name: "The dashboard's exact install command gives a remembra-mcp that starts"
        run: |
          python -m pip install pipx
          # The package spec the dashboard one-liner copies (dashboard/src/lib/agents.ts), satisfied by
          # this build's wheel (--find-links) so it runs before the release is on PyPI.
          spec=$(sed -n "s/^export const PIPX_INSTALL = \"pipx install --force '\\(.*\\)'\";\$/\\1/p" dashboard/src/lib/agents.ts)
          test -n "$spec"
          echo "spec: $spec"
          export PIPX_HOME=/tmp/pipx PIPX_BIN_DIR=/tmp/pipx/bin
          python -m pipx install --force --pip-args="--find-links dist" "$spec"
          /tmp/pipx/bin/remembra-mcp --help
          /tmp/pipx/bin/remembra-mcp --version
          /tmp/pipx/bin/remembra-relay --help
          /tmp/pipx/bin/remembra-install --help

      - name: "MCP Registry command (uvx remembra-mcp==<version>) answers initialize"
        # server.json points registry clients at the remembra-mcp launcher.
        run: |
          python -m build --wheel --outdir dist packages/remembra-mcp
          python scripts/check_release_versions.py
          pip install uv
          version=$(python -c 'import json; print(json.load(open("server.json"))["version"])')
          REMEMBRA_URL=http://127.0.0.1:9 REMEMBRA_API_KEY=rem_ci_check REMEMBRA_AGENT_ID=ci-check \
            python scripts/mcp_stdio_check.py --expect-tool session_brief --expect-tool close_session -- \
            uvx --isolated --find-links dist "remembra-mcp==${version}"

  # ---------------------------------------------------------------------------
  # Docker build smoke-test
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: remembra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # The production image (Dockerfile.cloud): build it, boot it against Qdrant
  # ---------------------------------------------------------------------------
  # Coolify builds Dockerfile.cloud on every deploy; the `docker` job above
  # only builds the self-host Dockerfile. This builds the production image
  # (dashboard, locked deps, baked reranker, litestream), never pushes it, then
  # scripts/ci/cloud_image_smoke.sh boots it next to a digest-pinned Qdrant and
  # checks /health, /health/ready, the dashboard, /oauth/callback and the
  # pre-migration backup. Plain docker CLI: no third-party actions.
  docker-cloud:
    name: Production image (Dockerfile.cloud) build + /health
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Dockerfile.cloud (not pushed)
        run: |
          docker buildx build \
            --file Dockerfile.cloud \
            --build-arg REMEMBRA_BUILD_SHA="${GITHUB_SHA}" \
            --tag remembra-cloud:ci \
            --load \
            .

      - name: Boot it against Qdrant and check /health
        run: bash scripts/ci/cloud_image_smoke.sh remembra-cloud:ci "${GITHUB_SHA}"
