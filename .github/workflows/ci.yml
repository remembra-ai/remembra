name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint & type-check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        # mcp + encryption for test collection; langchain/langgraph/openai-agents
        # so mypy can type-check the integration adapters against real framework
        # types (they import those libs at module top).
        run: pip install -e ".[server,cloud,dev,mcp,encryption,langchain,langgraph,openai-agents]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy
        run: mypy src/remembra

  # ---------------------------------------------------------------------------
  # Known advisories in the locked production dependencies (DEP-2)
  # ---------------------------------------------------------------------------
  # Audits exactly what Dockerfile.cloud installs from uv.lock (same extras).
  # --strict also fails when a package cannot be audited. An advisory that
  # cannot be fixed yet goes in pip-audit-allowlist.txt with a reason.
  audit:
    name: Dependency audit (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv and pip-audit (hash-pinned)
        run: |
          python -m pip install --require-hashes --no-deps -r .github/release-requirements.txt
          uv export --frozen --only-group audit --no-emit-project -o /tmp/audit-tools.txt
          python -m pip install --require-hashes --no-deps -r /tmp/audit-tools.txt

      - name: pip-audit the production dependency set
        run: |
          ignores=$(grep -oE '^[A-Z]+-[A-Za-z0-9-]+' pip-audit-allowlist.txt | sed 's/^/--ignore-vuln /')
          # shellcheck disable=SC2086  # one word per flag
          uv export --frozen --no-dev --no-emit-project --extra server --extra cloud --extra encryption --extra rerank --extra mcp \
            | pip-audit --disable-pip -r /dev/stdin --strict $ignores

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # mcp + encryption are needed at test-collection time (tests import
        # remembra.mcp.server and the encryption paths).
        run: pip install -e ".[server,cloud,dev,mcp,encryption]"

      - name: Run tests
        run: pytest --tb=short --ignore=tests/test_billing_paddle.py

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # The install the site advertises, from the built wheel
  # ---------------------------------------------------------------------------
  # Every other job installs the server extras, so a server-only import in a
  # client command would pass them. This one installs exactly what
  # `pipx install remembra` and `pipx install 'remembra[mcp]'` get.
  wheel-install:
    name: Wheel install (no extras, then [mcp], then the dashboard's command)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build the wheel
        # build and uv from the hash-pinned release tools (CI-1: no unpinned installs).
        run: |
          python -m pip install --require-hashes --no-deps -r .github/release-requirements.txt
          python -m build --wheel --outdir dist

      - name: Base install runs the relay and the installers
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/pip install dist/*.whl
          /tmp/base/bin/remembra-relay --help
          /tmp/base/bin/remembra-install --help
          /tmp/base/bin/remembra-install-codex --help
          /tmp/base/bin/remembra-doctor --help

      - name: "[mcp] install starts the MCP server"
        run: |
          python -m venv /tmp/mcp
          /tmp/mcp/bin/pip install "$(ls dist/*.whl)[mcp]"
          /tmp/mcp/bin/python -c 'import remembra.mcp.server'
          /tmp/mcp/bin/remembra-relay --help
          # main() gets past every import and stops at config validation.
          out=$(REMEMBRA_URL= /tmp/mcp/bin/remembra-mcp </dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "REMEMBRA_URL environment variable is required"
          # The server command on an [mcp]-only install names the missing extra instead of a traceback.
          out=$(/tmp/mcp/bin/remembra 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "needs the 'server' extra"

      - name: "The dashboard's exact install command gives a remembra-mcp that starts"
        run: |
          python -m pip install --require-hashes --no-deps -r .github/ci-requirements.txt
          # The package spec the dashboard one-liner copies (dashboard/src/lib/agents.ts), satisfied by
          # this build's wheel (--find-links) so it runs before the release is on PyPI.
          spec=$(sed -n "s/^export const PIPX_INSTALL = \"pipx install --force '\\(.*\\)'\";\$/\\1/p" dashboard/src/lib/agents.ts)
          test -n "$spec"
          echo "spec: $spec"
          export PIPX_HOME=/tmp/pipx PIPX_BIN_DIR=/tmp/pipx/bin
          python -m pipx install --force --pip-args="--find-links dist" "$spec"
          /tmp/pipx/bin/remembra-mcp --help
          /tmp/pipx/bin/remembra-mcp --version
          /tmp/pipx/bin/remembra-relay --help
          /tmp/pipx/bin/remembra-install --help

      - name: "MCP Registry command (uvx remembra-mcp==<version>) answers initialize"
        # server.json points registry clients at the remembra-mcp launcher.
        run: |
          python -m build --wheel --outdir dist packages/remembra-mcp
          python scripts/check_release_versions.py
          # uv (and uvx) came from .github/release-requirements.txt in "Build the wheel".
          version=$(python -c 'import json; print(json.load(open("server.json"))["version"])')
          REMEMBRA_URL=http://127.0.0.1:9 REMEMBRA_API_KEY=rem_ci_check REMEMBRA_AGENT_ID=ci-check \
            python scripts/mcp_stdio_check.py --expect-tool session_brief --expect-tool close_session -- \
            uvx --isolated --find-links dist "remembra-mcp==${version}"

  # ---------------------------------------------------------------------------
  # Docker build smoke-test
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: remembra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # The production image (Dockerfile.cloud): build it, boot it against Qdrant
  # ---------------------------------------------------------------------------
  # Coolify builds Dockerfile.cloud on every deploy; the `docker` job above
  # only builds the self-host Dockerfile. This builds the production image
  # (dashboard, locked deps, baked reranker, litestream), never pushes it, then
  # scripts/ci/cloud_image_smoke.sh boots it next to a digest-pinned Qdrant and
  # checks /health, /health/ready, the dashboard, /oauth/callback and the
  # pre-migration backup. Plain docker CLI: no third-party actions.
  docker-cloud:
    name: Production image (Dockerfile.cloud) build + /health
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Dockerfile.cloud (not pushed)
        run: |
          docker buildx build \
            --file Dockerfile.cloud \
            --build-arg REMEMBRA_BUILD_SHA="${GITHUB_SHA}" \
            --tag remembra-cloud:ci \
            --load \
            .

      - name: Boot it against Qdrant and check /health
        run: bash scripts/ci/cloud_image_smoke.sh remembra-cloud:ci "${GITHUB_SHA}"

  # ---------------------------------------------------------------------------
  # Repository hygiene: nothing private in the public repo
  # ---------------------------------------------------------------------------
  # scripts/ci/repo_hygiene.py: the tracked tree, on a pull request every
  # commit it adds, and on a push every commit the push added (a file added and
  # later deleted is still published). hooks/pre-push runs the same check before
  # anything leaves a laptop; the push step can only report what is already
  # public (a key it finds must be revoked), so the hooks are the prevention.
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Tracked files
        run: python scripts/ci/repo_hygiene.py tree
      - name: Commits in this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/ci/repo_hygiene.py range "origin/${BASE_REF}..HEAD"
      - name: Commits in this push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: python scripts/ci/repo_hygiene.py pushed "${BEFORE}" "${GITHUB_SHA}"
