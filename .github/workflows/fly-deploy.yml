name: Deploy to Fly.io

# Auto-deploy remembra-cloud on every push to main.
# Requires the FLY_API_TOKEN repository secret (Settings → Secrets → Actions).
# Generate one with: flyctl tokens create deploy -a remembra-cloud

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'landing/**'
      - 'site/**'
      - '**.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy remembra-cloud
    runs-on: ubuntu-latest
    if: github.repository_owner == 'remembra-ai'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify live
        run: |
          sleep 10
          # Fix #1: wrong-prefix paths must 404 as JSON, not serve SPA HTML
          code=$(curl -s -o /dev/null -w "%{http_code}" https://api.remembra.dev/v1/__deploy_check__)
          [ "$code" = "404" ] || { echo "prefix guard check failed ($code)"; exit 1; }
          curl -sf https://api.remembra.dev/health | grep -q '"status": *"ok"' || \
            curl -sf https://api.remembra.dev/health | grep -q '"status":"ok"'
          echo "deploy verified live"
