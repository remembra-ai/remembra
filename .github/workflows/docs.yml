name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'scripts/site_predeploy.py'
      - 'scripts/docs_csp.py'
      - 'docs-nginx/**'
      - '.github/docs-requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# CI-1: the build job installs and runs third-party code (MkDocs and its
# plugins), so it gets read rights only. Pages-write and OIDC belong to the
# deploy job alone, which runs no code of its own.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # actions/configure-pages reads the Pages site settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # The same hash-pinned MkDocs the docs.remembra.dev image builds with.
      - run: python -m pip install --require-hashes --no-deps -r .github/docs-requirements.txt
      # Every package an install command in docs/ or the README names must exist on PyPI or npm, and
      # every pinned minimum version (remembra[mcp]>=0.16) must be released on PyPI: until it is, this
      # job fails and the docs are not published with install lines that cannot resolve.
      - run: python scripts/site_predeploy.py --packages
      - run: mkdocs build --strict
      # docs-nginx/remembra-headers.conf must hash exactly the inline scripts these pages carry
      # (docs.Dockerfile recomputes it for the image; this keeps the committed copy honest).
      - run: python scripts/docs_csp.py site --check
      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
