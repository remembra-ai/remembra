# Security headers for every response from remembra.dev (included by nginx.conf).
#
# nginx drops a server's add_header lines in any location that sets its own,
# so nginx.conf includes this file again in each such location.
#
# The Content-Security-Policy line is written by scripts/site_csp.py: it hashes
# every inline <script> on the site into script-src. After editing an inline
# script, run `python scripts/site_csp.py` (tests fail until you do).
#
# remembra.dev loads no third-party script. Paddle.js runs only on
# app.remembra.dev, whose policy is in dashboard/nginx.conf. Google Fonts are
# allowed for the stylesheet and font files until the fonts are self-hosted.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# @csp
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4JIGxfbbBYHVqLQEyo3YhffNJ7a8IKEOaR2noUpEvW8=' 'sha256-Y2j+azs7CzpG8UxMfAVZ33Q7dUZ05KzsJnDZp4MdbpU=' 'sha256-r6KFc93qV02xmzZYSxqsfWDtfdbWP/bxrrEHmrcpI1A=' 'sha256-rrUVuII7nqD+CMmBpWdQLn3g8h/kgBB7ZCURI+iYLYg=' 'sha256-uP6mJDGhoBkFfT3i/sSbXMvu8cvHRCVy7QS1Hy8Ln5Q='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
# /@csp
