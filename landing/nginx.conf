# remembra.dev: the whole nginx configuration for the marketing site.
#
# Built into the image by landing/Dockerfile (Coolify: build pack "Dockerfile",
# base directory /landing, exposed port 8080). This file, not vercel.json, is
# what serves remembra.dev: clean URLs, the redirects for old and outside
# paths, the security headers and the 404 page.
#
# tests/test_landing_nginx.py reads it: every redirect must land on a page that
# exists, every inline <script> on the site must be hashed in the CSP, and the
# link checker in tests/test_landing_site.py resolves links through these rules.
#
# The process runs as the unprivileged "nginx" user, so it listens on 8080 and
# keeps its pid and temp files in /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/manifest+json webmanifest;
    }
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Behind Cloudflare and the Coolify proxy: redirects nginx makes itself
        # stay relative, so they never point at http:// or port 8080.
        absolute_redirect off;
        port_in_redirect off;

        include /etc/nginx/remembra-headers.conf;

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
        location = /404 {
            return 404;
        }

        # ---- Paths that live on another host -------------------------------
        # The docs site.
        location = /docs {
            return 301 https://docs.remembra.dev/;
        }
        location ^~ /docs/ {
            rewrite ^/docs/(.*)$ https://docs.remembra.dev/$1 permanent;
        }
        # The dashboard. Old checkouts land on /dashboard?checkout=success, so
        # the query string goes along.
        location = /signup {
            return 301 https://app.remembra.dev/signup$is_args$args;
        }
        location = /signup.html {
            return 301 https://app.remembra.dev/signup$is_args$args;
        }
        location = /dashboard {
            return 301 https://app.remembra.dev/$is_args$args;
        }
        location = /dashboard.html {
            return 301 https://app.remembra.dev/$is_args$args;
        }
        location = /login {
            return 301 https://app.remembra.dev/login$is_args$args;
        }

        # ---- Old or guessed paths on this site ------------------------------
        location = /refund {
            return 301 /refunds;
        }
        location = /refund-policy {
            return 301 /refunds;
        }
        location = /cookies {
            return 301 "/privacy#cookies";
        }
        location = /security-policy {
            return 301 "/security#disclosure";
        }
        # Launch posts linked /relay; the home page is the Remembra Relay page.
        # 302, so a real /relay page can take the path later.
        location = /relay {
            return 302 /;
        }
        # Release notes used to be one page per version; they are anchors on
        # /changelog now.
        location ~ ^/changelog/(v[0-9][0-9.]*[0-9])(\.html)?$ {
            return 301 "/changelog#$1";
        }
        # An old product page for the MCP server; its docs page replaced it.
        location ~ ^/changelog/mcp-server(\.html)?$ {
            return 301 https://docs.remembra.dev/integrations/mcp-server/;
        }

        # Two March 2026 tutorials were replaced by the docs pages they duplicated.
        location ~ ^/blog/getting-started-mcp-memory(\.html)?$ {
            return 301 https://docs.remembra.dev/getting-started/agent-setup/;
        }
        location ~ ^/blog/self-hosting-ai-memory(\.html)?$ {
            return 301 https://docs.remembra.dev/getting-started/docker/;
        }

        # ---- Clean URLs -------------------------------------------------------
        # /index.html -> / and /blog/index.html -> /blog.
        location = /index.html {
            return 301 /$is_args$args;
        }
        location ~ ^(/.+)/index\.html$ {
            return 301 $1$is_args$args;
        }
        # /pricing.html -> /pricing (the page is served below from pricing.html).
        location ~ ^(/.+)\.html$ {
            return 301 $1$is_args$args;
        }
        # /pricing/ -> /pricing
        location ~ ^(/.+)/$ {
            return 301 $1$is_args$args;
        }

        # RFC 9116 contact file, served as text.
        location = /.well-known/security.txt {
            default_type text/plain;
        }
        # Nothing else that starts with a dot is published.
        location ~ /\.(?!well-known/) {
            return 404;
        }

        # Stylesheets, scripts and images are not fingerprinted, so they are
        # cached for an hour, not forever.
        location ~* \.(?:css|js|svg|png|jpg|jpeg|ico|webmanifest)$ {
            include /etc/nginx/remembra-headers.conf;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
