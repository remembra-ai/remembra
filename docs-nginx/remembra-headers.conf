# Security headers for every response from docs.remembra.dev (included by
# docs-nginx/nginx.conf). LIVE-4 / CLI-11: the docs image used nginx's stock
# config and sent none of these.
#
# nginx drops a server's add_header lines in any location that sets its own,
# so nginx.conf includes this file again in each such location.
#
# The Content-Security-Policy line is written by scripts/docs_csp.py from the
# built site: every inline <script> the MkDocs theme and the pages carry is
# allowed by its SHA-256 hash, nothing else inline. docs.Dockerfile rewrites it
# on every image build; .github/workflows/docs.yml fails if this committed copy
# is out of date (run `python scripts/docs_csp.py <built site>`).
#
# Like remembra.dev and app.remembra.dev, the CSP ships as
# Content-Security-Policy-Report-Only: browsers block nothing and report each
# violation to api.remembra.dev/api/v1/csp-report. The other headers below are
# enforced; X-Frame-Options: DENY stands in for frame-ancestors, which
# report-only mode ignores. docs/OPERATIONS.md ("Content-Security-Policy:
# report-only") says how to switch to enforcing.
#
# The docs load no third-party script, font or image. The theme's repository
# widget reads stars and forks from api.github.com (connect-src).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# @csp
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-/8wPdzX9q0NNJXyA5lzsLojXFpkeaXVxhbfkUOQaWy8=' 'sha256-/K9p2JtEqCycL2fSbEonMakkteWpAHv57x2wndLqMNo=' 'sha256-/nhm8p50KJxvwWLggwJ1OF8Xgq5W/b3iKECITLASfOg=' 'sha256-10uztYJZm7OLYtHrFaYKCvTOAUfjM17+CoEWk5hLcc4=' 'sha256-6AD2lYT+DG5AWg1J7gx//2itam8lQHkYFRIChMXAuxY=' 'sha256-DrEMJJ29sL7vIloQzly+VUGMxKcBTMII+OfW7Y8AkG4=' 'sha256-E8JYuwxtfDJyr6a/sxURhgp5FjVXQjeMAo6OCIlUZrw=' 'sha256-FVoncDZ+9nJ7luKV23L7yPLWWrwtJ/t14hqhEUOxACs=' 'sha256-P+w/PRWS0k+VzdiK405qe+XLURNkOo4FDicZ9qRJByw=' 'sha256-apoQPHefCNWjxbCm+HzVDOAW4CSVWhY7VylQjgOFyfk=' 'sha256-exqRXrW/0laiImCrTE8a70vxyyY10FJVIppytLf/dbY=' 'sha256-hr/QnpIoqIQoQ4I2H6r0rMbE91/6ihkdhLsd0mj4bhI='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests; report-uri https://api.remembra.dev/api/v1/csp-report" always;
# /@csp
