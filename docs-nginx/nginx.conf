# docs.remembra.dev: the whole nginx configuration for the MkDocs site.
#
# Built into the image by docs.Dockerfile (Coolify app "remembra-docs": build
# pack Dockerfile, base directory /, Dockerfile location /docs.Dockerfile,
# exposed port 8080). tests/test_docs_nginx.py reads it.
#
# LIVE-4 / CLI-11 and CTR-1: before this file the image served the site with
# nginx's stock default.conf, as root, with the version in every error page and
# no security headers. The process now runs as the unprivileged "nginx" user,
# so it listens on 8080 and keeps its pid and temp files in /tmp (the same
# pattern as landing/nginx.conf).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Behind Cloudflare and the Coolify proxy: the redirects nginx makes
        # itself (/guides -> /guides/) stay relative, so they never point at
        # http:// or port 8080.
        absolute_redirect off;
        port_in_redirect off;

        include /etc/nginx/remembra-headers.conf;

        # MkDocs builds its own 404 page; a missing page gets it, with no
        # nginx version (server_tokens off).
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Nothing that starts with a dot is published.
        location ~ /\. {
            return 404;
        }

        # Theme and page assets: an hour (only the theme bundle's name carries a hash).
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
            include /etc/nginx/remembra-headers.conf;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        # Pages are directories with an index.html (MkDocs use_directory_urls):
        # nginx serves /guides/ from guides/index.html and answers /guides with
        # a 301 to /guides/ (relative, see absolute_redirect above), as the
        # stock config did; relative links in the pages need the slash.
        location / {
        }
    }
}
