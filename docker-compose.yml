# Remembra - Docker Compose
# Self-host the complete AI memory stack
#
# Usage:
#   docker compose up -d
#
# Access:
#   - API: http://localhost:8787
#   - Dashboard: http://localhost:8787 (served by API)
#   - Qdrant: http://localhost:6333 (optional direct access)

services:
  # ==========================================================================
  # Remembra API + Dashboard
  # ==========================================================================
  remembra:
    build:
      context: .
      dockerfile: Dockerfile
    image: remembra/remembra:latest
    container_name: remembra
    restart: unless-stopped
    ports:
      - "${REMEMBRA_PORT:-8787}:8787"
    environment:
      # Server config
      - REMEMBRA_HOST=0.0.0.0
      - REMEMBRA_PORT=8787
      
      # Database (SQLite for metadata)
      - REMEMBRA_DATABASE_URL=sqlite:////data/remembra.db
      
      # Vector database (Qdrant)
      - REMEMBRA_QDRANT_URL=http://qdrant:6333
      - REMEMBRA_QDRANT_COLLECTION=memories
      
      # Embeddings (default provider: OpenAI). Settings use the REMEMBRA_ prefix;
      # a bare OPENAI_API_KEY is ignored (REL-13).
      - REMEMBRA_EMBEDDING_PROVIDER=${REMEMBRA_EMBEDDING_PROVIDER:-openai}
      - REMEMBRA_EMBEDDING_MODEL=${REMEMBRA_EMBEDDING_MODEL:-text-embedding-3-small}
      - REMEMBRA_OPENAI_API_KEY=${REMEMBRA_OPENAI_API_KEY:-}
      
      # LLM for fact extraction (optional)
      - REMEMBRA_LLM_PROVIDER=${REMEMBRA_LLM_PROVIDER:-openai}
      - REMEMBRA_LLM_MODEL=${REMEMBRA_LLM_MODEL:-gpt-4o-mini}
      
      # Security
      - REMEMBRA_AUTH_ENABLED=${REMEMBRA_AUTH_ENABLED:-true}
      - REMEMBRA_JWT_SECRET=${REMEMBRA_JWT_SECRET:?REMEMBRA_JWT_SECRET is required (32+ chars)}
      # JSON list — a bare * fails settings parsing at boot
      - REMEMBRA_CORS_ORIGINS=${REMEMBRA_CORS_ORIGINS:-["http://localhost:8787"]}
      
      # Rate limiting
      - REMEMBRA_RATE_LIMIT_ENABLED=${REMEMBRA_RATE_LIMIT_ENABLED:-true}
      - REMEMBRA_ENABLE_RERANKING=${REMEMBRA_ENABLE_RERANKING:-false}
      
      # TTL default: add REMEMBRA_DEFAULT_TTL_DAYS=<int> to expire memories by default
      # (an empty value fails integer parsing at boot, so it is not set here)
      
      # Logging
      - REMEMBRA_LOG_LEVEL=${REMEMBRA_LOG_LEVEL:-info}
    volumes:
      - remembra_data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      # The self-host image has no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - remembra-network

  # ==========================================================================
  # Qdrant - Vector Database
  # ==========================================================================
  qdrant:
    # Matches the pinned qdrant-client (1.17.x, uses query_points) — REL-13
    image: qdrant/qdrant:v1.17.0
    container_name: remembra-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget: plain TCP check via bash (REL-19)
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - remembra-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  remembra_data:
    name: remembra_data
  qdrant_data:
    name: remembra_qdrant_data

# =============================================================================
# Networks
# =============================================================================
networks:
  remembra-network:
    name: remembra-network
    driver: bridge
